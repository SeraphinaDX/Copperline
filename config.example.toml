[general]
nick = "myNick"
user = "myNick"
real_name = "Copperline User"
logging = true
log_dir = "~/.local/state/copperline/logs"
timestamp = "15:04"
mouse = true
# IRCv3 +typing indicators. Disable send_typing if you prefer not to reveal
# when you are composing a message.
show_typing = true
send_typing = true
# Set false to hide "nick joined" lines while still tracking channel membership.
show_join_messages = true
history_lines = 2000
# Input/command history kept per buffer for the current session. Set 0 to disable.
input_history_limit = 10
# Show this many persisted log lines in muted grey when a channel or private
# query is opened. Set to 0 to disable the disk-backed conversation backlog.
log_backlog_lines = 10
reconnect_seconds = 10

# Copperline can run normally (direct), as a headless IRC relay with its own
# embedded SSH server (server), or as a local TUI attached to such a relay
# (client). Direct mode preserves the traditional behavior.
[relay]
mode = "direct"

# Relay-server settings. Uncomment/change these when mode = "server". The
# host key is generated automatically. The authorized-keys file is created if
# missing and re-read on every login, so adding a client key needs no restart.
# listen = "0.0.0.0:2222"
# user = "copperline"
# host_key = "~/.config/copperline/relay_host_ed25519"
# authorized_keys = "~/.config/copperline/relay_authorized_keys"
# Optional structured replay history, independent of general.logging.
# history_file = "~/.local/state/copperline/relay-history.json"

# Relay-client settings. A dedicated Ed25519 client key is generated at
# private_key (plus private_key.pub) if it does not exist. Copy the .pub file
# into the server's authorized_keys file. Pin the fingerprint printed by the
# relay server at startup.
# address = "relay.example.com:2222"
# user = "copperline"
# private_key = "~/.config/copperline/relay_client_ed25519"
# private_key_passphrase_env = "COPPERLINE_RELAY_KEY_PASSPHRASE"
# host_key_fingerprint = "SHA256:replace-with-server-fingerprint"
# insecure_skip_host_key_check = false

# Optional keyboard bindings. These defaults match Copperline's built-in keys.
# Supported forms include Ctrl+letter, Alt+letter, F1-F64, PageUp/PageDown,
# Up/Down, Home/End, Tab, Escape, and gotui-style IDs such as <M-n>.
[keybindings]
next_buffer = "Ctrl+N"
next_unread = "Alt+A"
search_next = "F3"
search_previous = "F4"
previous_buffer = "Ctrl+P"
user_list_down = "Alt+N"
user_list_up = "Alt+P"
jump_buffer = "F6"
jump_cancel = "Escape"
complete_nick = "Tab"
history_previous = "Up"
history_next = "Down"
transcript_page_up = "PageUp"
transcript_page_down = "PageDown"
transcript_line_up = "Alt+K"
transcript_line_down = "Alt+J"
copy_mode = "Alt+L"
follow_bottom = "End"
clear_input = "Ctrl+U"
quit = "Ctrl+C"
# Relay-client only. Also shown as a clickable status-bar control.
relay_reconnect = "Alt+R"

# Optional UI theme. Copperline uses these values by default if [theme] is omitted.
# Colors may be #RRGGBB true-color values or gotui names such as
# red, green, yellow, blue, cyan, magenta, white, grey, orange, purple,
# pink, gold, teal, turquoise, violet, lightblue, lightgreen, skyblue, etc.
[theme]
background = "#090d16"
panel = "#101827"
foreground = "#d8dee9"
muted = "#77839a"
border = "#36506b"
title = "#64d8cb"
selected_fg = "#071018"
selected_bg = "#d99058"
timestamp = "#77839a"
server = "#64d8cb"
channel = "#8bd49c"
query = "#d9a7ff"
unread = "#f6c177"
mention = "#ff9ecb"
notice = "#f6c177"
action = "#d9a7ff"
system = "#72c7ef"
error = "#ff6b81"
dcc = "#8bd49c"
topic = "#f2cc8f"
input = "#eef1f6"
cursor_fg = "#071018"
cursor_bg = "#64d8cb"
status_fg = "#071018"
status_bg = "#64d8cb"
nick_colors = [
    "#ff7b72", "#f6c177", "#8bd49c", "#64d8cb",
    "#72c7ef", "#d9a7ff", "#ff9ecb", "#d99058",
]

# Optional embedded Lua scripting. Scripts are loaded alphabetically from
# this directory at startup and can be reloaded with /lua reload.
[scripting]
enabled = true
dir = "~/.config/copperline/scripts"

[dcc]
enabled = true
download_dir = "~/Downloads"
# For outgoing DCC SEND, set this to the public/LAN IP peers can reach.
advertise_ip = "192.0.2.10"
listen_addr = "0.0.0.0:0"

# Optional Gotify notifications for incoming mentions and private messages.
# Create a Gotify application and export its application token before starting
# Copperline. An inline token is supported but token_env is recommended.
[gotify]
enabled = false
url = "https://push.example.com"
token_env = "COPPERLINE_GOTIFY_TOKEN"
# token = "A..."
mentions = true
private_messages = true
priority = 5
timeout_seconds = 5

[[server]]
name = "libera"
host = "irc.libera.chat"
port = 6697
tls = true
auto_connect = true
nick = "myNick"
channels = ["#go-nuts", "#linux"]
# Extra capabilities are added to Copperline's built-in IRCv3 request set.
caps = []

[server.sasl]
mechanism = "plain"
username = "myNick"
password_env = "LIBERA_IRC_PASSWORD"

[[server]]
name = "oftc"
host = "irc.oftc.net"
port = 6697
tls = true
auto_connect = false
channels = ["#debian"]
